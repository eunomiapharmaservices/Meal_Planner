function getNaturalServing(name){
  if(!name)return null;
  const lower=name.toLowerCase();
  // exact match first
  if(NATURAL_SERVINGS[lower])return NATURAL_SERVINGS[lower];
  // partial match
  for(const key of Object.keys(NATURAL_SERVINGS)){
    if(lower.includes(key)||key.includes(lower.split(" ")[0]))return NATURAL_SERVINGS[key];
  }
  return null;
}

function searchDB(q){
  const words=q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return NDB.map(item=>{
    const h=(item.n+" "+item.b).toLowerCase();
    const score=words.reduce((s,w)=>s+(h.includes(w)?(h.startsWith(w)?3:1):-5),0);
    return{...item,score};
  }).filter(i=>i.score>0).sort((a,b)=>b.score-a.score).slice(0,25)
    .map(i=>({name:i.n,brand:i.b,cal100:i.c,prot100:i.p,carb100:i.cr,fat100:i.f,defaultGrams:100}));
}

/* ─── Helpers ───────────────────────────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function calcTDEE(wkg,hcm,age){
  return Math.round((10*wkg+6.25*hcm-5*age+5)*1.55);
}
function calcDefaults(wkg,hcm,age,goal,calOverride){
  const tdee=calcTDEE(wkg,hcm,age);
  const adj={loss:-500,maintain:0,gain:500,build:300};
  const calories=calOverride||Math.round(tdee+(adj[goal]||0));
  const pm={loss:2,maintain:1.6,gain:1.8,build:2.2};
  const protein=Math.round(wkg*(pm[goal]||1.6));
  const fat=Math.round(calories*0.25/9);
  const carbs=Math.max(20,Math.round((calories-protein*4-fat*9)/4));
  return{calories,protein,carbs,fat,tdee};
}
// Calculate daily calorie target from goal, current weight, target weight, weeks
function calcCaloriesFromGoal(wkg,hcm,age,goal,targetWkg,weeks){
  const tdee=calcTDEE(wkg,hcm,age);
  if(goal==="maintain")return{calories:tdee,note:""};
  if(!targetWkg||!weeks||weeks<=0)return{calories:Math.round(tdee+(goal==="loss"?-500:500)),note:""};
  const diff=targetWkg-wkg; // negative = loss, positive = gain
  const totalKcal=diff*7700; // 1kg ≈ 7700 kcal
  const dailyAdj=Math.round(totalKcal/(weeks*7));
  // Cap at sensible limits
  const capped=Math.max(-1000,Math.min(1000,dailyAdj));
  const calories=Math.max(1200,Math.round(tdee+capped));
  const actualWeeks=Math.abs(Math.round(totalKcal/(capped*7)));
  const note=capped!==dailyAdj?`Adjusted to safe limit. Realistic timeframe: ~${actualWeeks} weeks.`:"";
  return{calories,note,dailyAdj:capped};
}
function calcBurn(wkg,actId,mins,intId){
  const a=ACTIVITY_TYPES.find(x=>x.id===actId)||ACTIVITY_TYPES[0];
  const i=INTENSITY.find(x=>x.id===intId)||INTENSITY[1];
  return Math.round(a.met*i.mult*wkg*mins/60);
}
// meal slot helpers — each slot is now an array of items
function slotItems(v){return Array.isArray(v)?v:(v?[v]:[]);}
function slotKcal(v){return slotItems(v).reduce((s,i)=>s+(i?.calories||0),0);}
function slotMacro(v,k){return slotItems(v).reduce((s,i)=>s+(i?.[k]||0),0);}

async function claude(prompt,max=1200){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:max,messages:[{role:"user",content:prompt}]})
  });
  const d=await r.json();
  return(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}

const LS_PROFILES="nourish_profiles";
const lsKey=id=>"nourish_data_"+id;

function loadProfiles(){
  try{return JSON.parse(localStorage.getItem(LS_PROFILES)||"[]");}catch{return[];}
}
function saveProfiles(profiles){
  localStorage.setItem(LS_PROFILES,JSON.stringify(profiles));
}
function loadProfileData(id){
  try{return JSON.parse(localStorage.getItem(lsKey(id))||"null");}catch{return null;}
}
function saveProfileData(id,data){
  localStorage.setItem(lsKey(id),JSON.stringify(data));
}
function deleteProfileData(id){
  localStorage.removeItem(lsKey(id));
}

  const[profiles,setProfiles]=useState(loadProfiles);

  const doDelete=(id)=>{
    const updated=profiles.filter(p=>p.id!==id);
    saveProfiles(updated);
    deleteProfileData(id);
    setProfiles(updated);
    setDelConfirm(null);
  };

  return(
    <div style={{maxWidth:480,margin:"0 auto",padding:"0 16px 40px"}}>

        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:20}}>
          {profiles.map(p=>(
            <div key={p.id} style={{background:C.card,borderRadius:16,border:"1px solid "+C.border,overflow:"hidden"}}>

                  {p.avatar||"🧑"}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:16,fontWeight:700,color:C.text}}>{p.name}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>
                    {GOALS.find(g=>g.id===p.goal)?.icon} {GOALS.find(g=>g.id===p.goal)?.label}
                    {" · "}{p.age}y {Math.round(p.weightKg)}kg
                  </div>
                  <div style={{fontSize:11,color:C.border,marginTop:2}}>
                    Last active: {p.lastActive?new Date(p.lastActive).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"Never"}
                  </div>
                </div>
                <div style={{fontSize:20,color:C.accent}}>›</div>
              </div>
              <div style={{borderTop:"1px solid "+C.border,display:"flex"}}>

                  Open →

                <div style={{width:1,background:C.border}}/>
                <button onClick={()=>setDelConfirm(p.id)} style={{flex:1,padding:"10px 0",background:"none",border:"none",color:C.danger,fontSize:12,cursor:"pointer"}}>

      <button onClick={onCreate} style={{width:"100%",padding:"16px 0",borderRadius:14,border:"2px dashed "+C.dim,background:"transparent",color:C.accent,fontWeight:700,fontSize:15,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>
        + Create New Profile
      </button>

      {/* Delete confirm modal */}
      {delConfirm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:C.card,borderRadius:20,padding:28,maxWidth:340,width:"100%",border:"1px solid "+C.border,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
            <div style={{fontSize:17,fontWeight:700,color:C.text,marginBottom:8}}>Delete this profile?</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:24}}>All meal plans, activity logs and settings for this profile will be permanently deleted.</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDelConfirm(null)} style={{flex:1,padding:"12px 0",borderRadius:10,border:"1px solid "+C.border,background:"none",color:C.muted,fontWeight:600,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>doDelete(delConfirm)} style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",background:C.danger,color:"#fff",fontWeight:700,cursor:"pointer"}}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Create / Edit Profile Form ────────────────────────────────────────────── */
function ProfileForm({existing,onSave,onCancel}){
  const[form,setForm]=useState(existing?{
    name:existing.name,avatar:existing.avatar||"🧑",
    age:existing.age,height:existing.unit==="imperial"?Math.round(existing.heightCm/2.54):existing.heightCm,
    weight:existing.unit==="imperial"?Math.round(existing.weightKg/0.453592):existing.weightKg,
    unit:existing.unit||"metric",goal:existing.goal,
    targetWeight:existing.targetWeightKg?(existing.unit==="imperial"?Math.round(existing.targetWeightKg/0.453592):Math.round(existing.targetWeightKg)):"",
    weeks:existing.weeks||""
  }:{name:"",avatar:"🧑",age:"",height:"",weight:"",unit:"metric",goal:"",targetWeight:"",weeks:""});
  const[pickingAvatar,setPickingAvatar]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const valid=form.name.trim()&&form.age&&form.height&&form.weight&&form.goal;

  const handleSave=()=>{
    let wkg=parseFloat(form.weight),hcm=parseFloat(form.height);
    if(form.unit==="imperial"){wkg*=0.453592;hcm*=2.54;}
    let targetWkg=form.targetWeight?parseFloat(form.targetWeight):null;
    if(targetWkg&&form.unit==="imperial")targetWkg*=0.453592;
    const weeks=form.weeks?parseInt(form.weeks):null;
    const{calories,note}=calcCaloriesFromGoal(wkg,hcm,parseFloat(form.age),form.goal,targetWkg,weeks);
    const def=calcDefaults(wkg,hcm,parseFloat(form.age),form.goal,calories);
    const profile={
      id:existing?.id||uid(),
      name:form.name.trim(),avatar:form.avatar,
      age:parseFloat(form.age),weightKg:wkg,heightCm:hcm,
      unit:form.unit,goal:form.goal,
      targetWeightKg:targetWkg,weeks:weeks,
      targets:{...def,_wkg:wkg,_hcm:hcm,_age:parseFloat(form.age)},
      lastActive:Date.now(),
    };
    onSave(profile,def);
  };
  // live preview of recommended calories
  const caloriePreview=React.useMemo(()=>{
    const wkg=parseFloat(form.weight),hcm=parseFloat(form.height),age=parseFloat(form.age);
    if(!wkg||!hcm||!age||!form.goal)return null;
    let wkgM=wkg,hcmM=hcm;
    if(form.unit==="imperial"){wkgM*=0.453592;hcmM*=2.54;}
    let targetWkg=form.targetWeight?parseFloat(form.targetWeight):null;
    if(targetWkg&&form.unit==="imperial")targetWkg*=0.453592;
    const weeks=form.weeks?parseInt(form.weeks):null;
    return calcCaloriesFromGoal(wkgM,hcmM,age,form.goal,targetWkg,weeks);
  },[form.weight,form.height,form.age,form.goal,form.targetWeight,form.weeks,form.unit]);

  return(
    <div style={{maxWidth:520,margin:"0 auto",padding:"0 16px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"24px 0 20px"}}>
        <button onClick={onCancel} style={{background:"none",border:"1px solid "+C.border,borderRadius:8,padding:"8px 14px",color:C.muted,cursor:"pointer",fontSize:13}}>← Back</button>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:C.text,fontWeight:700}}>
          {existing?"Edit Profile":"New Profile"}
        </div>
      </div>

      <div style={{background:C.card,borderRadius:20,padding:24,border:"1px solid "+C.border}}>
        {/* Avatar + Name */}
        <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:24}}>
          <button onClick={()=>setPickingAvatar(true)} style={{width:64,height:64,borderRadius:"50%",background:C.surf,border:"2px solid "+C.dim,fontSize:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {form.avatar}
          </button>
          <div style={{flex:1}}>
            <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Name</label>
            <input placeholder="e.g. Alice" value={form.name} onChange={e=>set("name",e.target.value)} maxLength={20}
              style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1px solid "+C.border,background:C.surf,color:C.text,fontSize:15,outline:"none",fontFamily:"'DM Sans',sans-serif"}}/>
          </div>
        </div>

        {/* Units */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {["metric","imperial"].map(u=><button key={u} onClick={()=>set("unit",u)} style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",cursor:"pointer",background:form.unit===u?C.accent:C.surf,color:form.unit===u?"#0f1a0f":C.muted,fontWeight:600,fontSize:13,textTransform:"capitalize"}}>{u}</button>)}
        </div>

        {/* Age / Height / Weight */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
          {[
            {k:"age",l:"Age",ph:"25",u:"yrs"},
            {k:"height",l:"Height",ph:form.unit==="metric"?"175":"69",u:form.unit==="metric"?"cm":"in"},
            {k:"weight",l:"Weight",ph:form.unit==="metric"?"70":"154",u:form.unit==="metric"?"kg":"lbs"},
          ].map(({k,l,ph,u})=>(
            <div key={k}>
              <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>{l} <span style={{color:C.border}}>({u})</span></label>
              <input type="number" placeholder={ph} value={form[k]} onChange={e=>set(k,e.target.value)}
                style={{width:"100%",padding:"12px 10px",borderRadius:10,border:"1px solid "+C.border,background:C.surf,color:C.text,fontSize:15,fontFamily:"'DM Mono',monospace",boxSizing:"border-box",outline:"none"}}/>
            </div>
          ))}
        </div>

        {/* Goal */}
        <div style={{marginBottom:24}}>
          <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:12}}>Goal</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {GOALS.map(g=>(
              <button key={g.id} onClick={()=>set("goal",g.id)} style={{padding:"14px 12px",borderRadius:12,border:"2px solid "+(form.goal===g.id?C.accent:C.border),background:form.goal===g.id?"#1e2e1e":C.surf,cursor:"pointer",textAlign:"left"}}>
                <div style={{fontSize:20,marginBottom:4}}>{g.icon}</div>
                <div style={{fontWeight:700,color:C.text,fontSize:13}}>{g.label}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>{g.desc}</div>
              </button>
            ))}
          </div>
        </div>

        {/* Goal target + timeframe — only for loss/gain/build */}
        {form.goal&&form.goal!=="maintain"&&(
          <div style={{marginBottom:24}}>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Goal Details <span style={{color:C.border,fontWeight:400,textTransform:"none"}}>(optional but recommended)</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>
                  {form.goal==="loss"?"Target weight":"Target weight"} <span style={{color:C.border}}>({form.unit==="metric"?"kg":"lbs"})</span>
                </label>
                <input type="number" placeholder={form.unit==="metric"?"65":"145"} value={form.targetWeight} onChange={e=>set("targetWeight",e.target.value)}
                  style={{width:"100%",padding:"12px 10px",borderRadius:10,border:"1px solid "+C.border,background:C.surf,color:C.text,fontSize:15,fontFamily:"'DM Mono',monospace",boxSizing:"border-box",outline:"none"}}/>
              </div>
              <div>
                <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Timeframe <span style={{color:C.border}}>(weeks)</span></label>
                <input type="number" placeholder="12" value={form.weeks} onChange={e=>set("weeks",e.target.value)}
                  style={{width:"100%",padding:"12px 10px",borderRadius:10,border:"1px solid "+C.border,background:C.surf,color:C.text,fontSize:15,fontFamily:"'DM Mono',monospace",boxSizing:"border-box",outline:"none"}}/>
              </div>
            </div>
            {/* Quick timeframe picks */}
            <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
              {[{l:"4 weeks",v:4},{l:"8 weeks",v:8},{l:"12 weeks",v:12},{l:"6 months",v:26},{l:"1 year",v:52}].map(({l,v})=>(
                <button key={v} onClick={()=>set("weeks",v)} style={{padding:"5px 10px",borderRadius:8,border:"1px solid "+(parseInt(form.weeks)===v?C.accent:C.border),background:parseInt(form.weeks)===v?"#1e2e1e":C.surf,color:parseInt(form.weeks)===v?C.accent:C.muted,fontSize:11,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            {/* Live calorie preview */}
            {caloriePreview&&(
              <div style={{marginTop:14,padding:"14px 16px",borderRadius:12,background:caloriePreview.note?"#2a1e0a":"#1a2e1a",border:"1px solid "+(caloriePreview.note?C.warn:C.dim)}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,color:C.muted}}>Recommended daily calories</span>
                  <span style={{fontSize:20,fontWeight:700,color:C.gold,fontFamily:"'DM Mono',monospace"}}>{caloriePreview.calories} kcal</span>
                </div>
                {form.targetWeight&&form.weeks&&(
                  <div style={{fontSize:11,color:C.muted,marginTop:4}}>
                    {Math.abs(parseFloat(form.targetWeight)-(form.unit==="imperial"?Math.round(parseFloat(form.weight)):parseFloat(form.weight))).toFixed(1)}{form.unit==="metric"?"kg":"lbs"} {form.goal==="loss"?"to lose":"to gain"} in {form.weeks} weeks
                    {" → "}<span style={{color:C.accent}}>{Math.abs(caloriePreview.dailyAdj||0)} kcal/day {form.goal==="loss"?"deficit":"surplus"}</span>
                  </div>
                )}
                {caloriePreview.note&&<div style={{fontSize:11,color:C.warn,marginTop:6}}>⚠️ {caloriePreview.note}</div>}
              </div>
            )}
          </div>
        )}
        <button disabled={!valid} onClick={handleSave} style={{width:"100%",padding:"16px 0",borderRadius:12,border:"none",cursor:valid?"pointer":"not-allowed",background:valid?C.accent:C.border,color:"#0f1a0f",fontWeight:700,fontSize:15,fontFamily:"'DM Sans',sans-serif",opacity:valid?1:0.5}}>
          {existing?"Save Changes":"Create Profile →"}
        </button>
      </div>

      {/* Avatar picker */}
      {pickingAvatar&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:C.card,borderRadius:20,padding:24,maxWidth:340,width:"100%",border:"1px solid "+C.border}}>
            <div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:16,fontFamily:"'Playfair Display',serif"}}>Pick an avatar</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:20}}>
              {AVATARS.map(a=>(
                <button key={a} onClick={()=>{set("avatar",a);setPickingAvatar(false);}}
                  style={{fontSize:28,padding:"10px 0",borderRadius:12,border:"2px solid "+(form.avatar===a?C.accent:C.border),background:form.avatar===a?"#1e2e1e":C.surf,cursor:"pointer"}}>
                  {a}
                </button>
              ))}
            </div>
            <button onClick={()=>setPickingAvatar(false)} style={{width:"100%",padding:"11px 0",borderRadius:10,border:"1px solid "+C.border,background:"none",color:C.muted,cursor:"pointer",fontSize:13}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Recipe Modal ───────────────────────────────────────────────────────────── */
function RecipeModal({meal,onClose,onAdd}){
  const[recipe,setRecipe]=useState(null);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState("");
  useEffect(()=>{
    (async()=>{
      try{
        const txt=await claude(`Write a recipe for "${meal.name}". Return ONLY this JSON (no markdown):\n{"title":"...","servings":2,"prepTime":"10 mins","cookTime":"20 mins","difficulty":"Easy","ingredients":[{"amount":"200g","item":"chicken breast"}],"steps":["Step 1.","Step 2."],"tips":"One pro tip."}`);
        const m=txt.match(/\{[\s\S]*\}/);
        setRecipe(JSON.parse(m[0]));
      }catch{setErr("Could not load recipe. Check internet.");}
      setLoading(false);

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>

        <div style={{width:40,height:4,borderRadius:2,background:C.border,margin:"0 auto 18px"}}/>

          <div style={{flex:1,paddingRight:12}}>
            <div style={{fontSize:11,color:C.accent,textTransform:"uppercase",letterSpacing:1,fontWeight:600,marginBottom:4}}>📖 Recipe</div>
            <div style={{fontSize:21,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif",lineHeight:1.2}}>{meal.name}</div>
            {meal.calories&&<div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
              {[["🔥",meal.calories+" kcal",C.gold],["💪",(meal.protein||0)+"g P",C.accent],["🍞",(meal.carbs||0)+"g C",C.blue],["🥑",(meal.fat||0)+"g F",C.warn]].map(([e,v,col])=>(
                <span key={v} style={{fontSize:10,color:col}}>{e} {v}</span>

          <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer"}}>✕</button>

        {loading&&<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:36,marginBottom:12}}>👨‍🍳</div><div style={{color:C.muted,fontSize:13}}>Generating recipe…</div></div>}
        {err&&<div style={{color:C.danger,textAlign:"center",padding:"20px 0",fontSize:13}}>{err}</div>}
        {recipe&&<div>
          <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
            {[{l:"Serves",v:recipe.servings},{l:"Prep",v:recipe.prepTime},{l:"Cook",v:recipe.cookTime},{l:"Level",v:recipe.difficulty}].map(({l,v})=>v&&(
              <div key={l} style={{background:C.surf,borderRadius:10,padding:"8px 14px",border:"1px solid "+C.border,textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text}}>{v}</div>
                <div style={{fontSize:10,color:C.muted,marginTop:1}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:14,fontWeight:700,color:C.accent,marginBottom:10}}>🛒 Ingredients</div>
            {(recipe.ingredients||[]).map((ing,i)=>(
              <div key={i} style={{display:"flex",gap:12,padding:"8px 12px",background:C.surf,borderRadius:10,border:"1px solid "+C.border,marginBottom:6}}>
                <div style={{fontSize:12,fontWeight:700,color:C.gold,minWidth:64,fontFamily:"'DM Mono',monospace"}}>{ing.amount}</div>
                <div style={{fontSize:13,color:C.text}}>{ing.item}</div>
              </div>
            ))}
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:14,fontWeight:700,color:C.accent,marginBottom:10}}>👨‍🍳 Method</div>
            {(recipe.steps||[]).map((step,i)=>(
              <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:10}}>
                <div style={{minWidth:26,height:26,borderRadius:"50%",background:C.accent,color:"#0f1a0f",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                <div style={{fontSize:13,color:C.text,lineHeight:1.6,paddingTop:4}}>{step}</div>
              </div>
            ))}
          </div>
          {recipe.tips&&<div style={{background:"#1a2a1a",borderRadius:12,padding:"12px 14px",marginBottom:20,border:"1px solid "+C.dim}}>
            <div style={{fontSize:11,color:C.accent,fontWeight:600,marginBottom:4}}>💡 Pro Tip</div>

        </div>}
      </div>
    </div>
  );

/* ─── Meal Cell — supports multiple items per slot ───────────────────────────── */
function MealCell({day,meal,value,onEdit,onRecipe,onRemoveItem,onClearSlot}){
  const[open,setOpen]=useState(false);
  const[deleteConfirm,setDeleteConfirm]=useState(null); // index to confirm delete

  const total=slotKcal(value);
  const totalP=Math.round(slotMacro(value,"protein")*10)/10;

    return(
      <div onClick={()=>onEdit(day,meal)}
        style={{minHeight:64,padding:"10px 12px",borderRadius:10,border:"1px dashed "+C.border,background:C.surf,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontSize:11,color:C.border}}>+ Add</div>

  return(
    <div style={{position:"relative"}}>

          <div onClick={()=>setDeleteConfirm(null)} style={{position:"fixed",inset:0,zIndex:59}}/>

/* ─── Nutrition Card — natural servings for whole foods, grams for others ──────── */
function NutritionCard({item,onAdd,onClose,onRecipe}){
  const ns=getNaturalServing(item.name);
  // Natural serving mode (eggs, fruits, etc.)
  const[sizeIdx,setSizeIdx]=useState(ns?ns.def:0);
  const[count,setCount]=useState(1);
  // Gram mode fallback
  const[grams,setGrams]=useState(100);

  const getCalc=(g)=>{const s=g/100;return{cal:Math.round(item.cal100*s),prot:Math.round(item.prot100*s*10)/10,carb:Math.round(item.carb100*s*10)/10,fat:Math.round(item.fat100*s*10)/10};};

  if(ns){
    const size=ns.sizes[sizeIdx];
    const totalG=size.g*count;
    const{cal,prot,carb,fat}=getCalc(totalG);
    const label=count===1?`1 ${size.l} ${ns.unit}`:`${count} ${size.l} ${ns.unit}s`;
    return(
      <div style={{background:"#111e11",border:"1px solid "+C.dim,borderRadius:14,padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{flex:1,paddingRight:8}}><div style={{fontSize:14,fontWeight:700,color:C.text,lineHeight:1.3}}>{item.name}</div>{item.brand&&<div style={{fontSize:10,color:C.muted,marginTop:2}}>{item.brand}</div>}</div>
          <div style={{fontSize:18,fontWeight:700,color:C.gold,fontFamily:"'DM Mono',monospace"}}>{cal} <span style={{fontSize:10,color:C.muted}}>kcal</span></div>

          <div style={{fontSize:10,color:C.muted,marginBottom:6}}>Size</div>

            {ns.sizes.map((s,i)=>(
              <button key={i} onClick={()=>setSizeIdx(i)} style={{padding:"5px 10px",borderRadius:8,border:"1px solid "+(sizeIdx===i?C.accent:C.border),background:sizeIdx===i?"#1e2e1e":C.surf,color:sizeIdx===i?C.accent:C.muted,fontSize:11,cursor:"pointer",fontWeight:sizeIdx===i?700:400}}>

            <div key={l} style={{flex:1,background:C.surf,borderRadius:8,padding:"6px 4px",textAlign:"center",border:"1px solid "+C.border}}>
              <div style={{fontSize:13,fontWeight:700,color:col,fontFamily:"'DM Mono',monospace"}}>{v}g</div>

        <div style={{display:"flex",alignItems:"center",gap:4}}>

          <span style={{fontSize:11,color:C.muted}}>g</span>
        </div>

      <div style={{display:"flex",gap:5,marginBottom:10}}>
        {[50,100,150,200,300].map(g=><button key={g} onClick={()=>setGrams(g)} style={{flex:1,padding:"4px 0",borderRadius:6,border:"1px solid "+(grams===g?C.accent:C.border),background:grams===g?"#1e2e1e":C.surf,color:grams===g?C.accent:C.muted,fontSize:10,cursor:"pointer"}}>{g}g</button>)}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>{onAdd({name:item.name,calories:cal,protein:prot,carbs:carb,fat});onClose();}}
          style={{flex:2,padding:"11px 0",borderRadius:10,border:"none",background:C.accent,color:"#0f1a0f",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Add {grams}g</button>
        <button onClick={()=>onRecipe({name:item.name,calories:cal,protein:prot,carbs:carb,fat})}
          style={{flex:1,padding:"11px 0",borderRadius:10,border:"1px solid "+C.border,background:C.surf,color:C.accent,fontWeight:600,fontSize:12,cursor:"pointer"}}>📖 Recipe</button>
      </div>
    </div>
  );
}

/* ─── Meal Search ────────────────────────────────────────────────────────────── */
function MealSearch({onSave,onClose,onRecipe}){
  const[q,setQ]=useState(""),loading=useState(false),results=useState([]),err=useState(""),searched=useState(false),src=useState("");
  const[isLoading,setLoading2]=useState(false),[res,setRes]=useState([]),[error,setErr]=useState(""),
    [hasSearched,setHasSearched]=useState(false),[source,setSource]=useState("");

  const doSearch=async()=>{
    if(!q.trim())return;
    setLoading2(true);setErr("");setRes([]);setHasSearched(true);setSource("");
    const local=searchDB(q.trim());
    if(local.length){setRes(local);setSource("local");setLoading2(false);fetchOnline(q.trim());return;}
    await fetchOnline(q.trim());setLoading2(false);
  };
  const fetchOnline=async(query)=>{
    const offUrl="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(query)+"&json=1&page_size=40&fields=product_name,product_name_en,brands,nutriments&action=process";
    for(const attempt of[()=>fetch(offUrl),()=>fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(offUrl)),()=>fetch("https://corsproxy.io/?"+encodeURIComponent(offUrl))]){
      try{const r=await attempt();if(!r.ok)continue;const d=await r.json();
        const p=(d.products||[]).map(pr=>{const n=pr.nutriments||{};const cal=n["energy-kcal_100g"]??Math.round((n["energy_100g"]||0)/4.184);if(!cal||cal<=0)return null;const name=(pr.product_name_en||pr.product_name||"").trim();if(!name||name.length<2)return null;return{name,brand:(pr.brands||"").split(",")[0].trim(),cal100:Math.round(cal),prot100:Math.round((n["proteins_100g"]||0)*10)/10,carb100:Math.round((n["carbohydrates_100g"]||0)*10)/10,fat100:Math.round((n["fat_100g"]||0)*10)/10,defaultGrams:100};}).filter(Boolean).slice(0,25);
        if(p.length){setRes(p);setSource("openfoodfacts");setLoading2(false);return;}
      }catch{}
    }
    try{const txt=await claude('Nutrition per 100g for "'+query+'" as JSON array of 8 variants. Each: {"name":"...","brand":"","cal100":N,"prot100":N,"carb100":N,"fat100":N}. ONLY the array.',800);const m=txt.match(/\[[\s\S]*?\]/);if(m){const items=JSON.parse(m[0]).map(i=>({...i,defaultGrams:100}));if(items.length){setRes(items);setSource("ai");setLoading2(false);return;}}}catch{}
    setErr("Not found. Check internet and try again.");setLoading2(false);
  };
  const CHIPS=["Chicken breast","Banana","Oats","Salmon","Greek yogurt","Brown rice","Eggs","Avocado","Protein bar","Tuna"];
  const srcLabel=source==="local"?"📦 Built-in":source==="openfoodfacts"?"🌐 Open Food Facts":source==="ai"?"🤖 AI":"";
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1,position:"relative"}}>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:15,pointerEvents:"none"}}>🔍</span>
          <input autoFocus placeholder="Search any food or ingredient…" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}
            style={{width:"100%",padding:"12px 12px 12px 38px",borderRadius:12,border:"1px solid "+C.border,background:C.surf,color:C.text,fontSize:14,outline:"none",fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}}/>
        </div>
        <button onClick={doSearch} disabled={!q.trim()||isLoading} style={{padding:"0 18px",borderRadius:12,border:"none",background:q.trim()&&!isLoading?C.accent:C.border,color:"#0f1a0f",fontWeight:700,fontSize:13,cursor:q.trim()&&!isLoading?"pointer":"not-allowed",whiteSpace:"nowrap"}}>{isLoading?"…":"Go"}</button>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}><div style={{width:6,height:6,borderRadius:"50%",background:C.accent}}/><span style={{fontSize:10,color:C.muted}}>{srcLabel||"200+ foods built-in · works offline"}</span></div>
      {!hasSearched&&<div style={{marginBottom:16}}><div style={{fontSize:11,color:C.muted,marginBottom:8}}>Popular:</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{CHIPS.map(chip=><button key={chip} onClick={()=>{setQ(chip);setTimeout(doSearch,50);}} style={{padding:"5px 10px",borderRadius:20,border:"1px solid "+C.border,background:C.surf,color:C.muted,fontSize:11,cursor:"pointer"}}>{chip}</button>)}</div></div>}
      {isLoading&&<div style={{textAlign:"center",padding:"28px 0"}}><div style={{fontSize:28,marginBottom:10}}>⏳</div><div style={{color:C.muted,fontSize:13}}>Searching…</div></div>}
      {error&&!isLoading&&<div style={{background:"#2a1a1a",border:"1px solid "+C.danger,borderRadius:12,padding:"14px 16px",textAlign:"center"}}><div style={{fontSize:20,marginBottom:6}}>😕</div><div style={{color:C.danger,fontSize:13}}>{error}</div></div>}
      {!isLoading&&res.length>0&&<div><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>{res.length} results · set serving before adding</div>{res.map((r,i)=><NutritionCard key={i} item={r} onAdd={onSave} onClose={onClose} onRecipe={onRecipe}/>)}</div>}

}

}

    </div>
  );

/* ─── Copy Day Modal ─────────────────────────────────────────────────────────── */
function CopyDayModal({sourceDay,plan,onCopy,onClose}){
  const others=DAYS.filter(d=>d!==sourceDay);
  const[selected,setSelected]=useState([]);
  const[overwrite,setOverwrite]=useState("merge"); // "merge" | "replace"
  const toggle=d=>setSelected(s=>s.includes(d)?s.filter(x=>x!==d):[...s,d]);
  const allFilled=d=>MEALS.some(m=>slotItems(plan[d]?.[m]).length>0);
  const hasConflict=selected.some(allFilled);

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:20,padding:24,maxWidth:420,width:"100%",border:"1px solid "+C.border,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1}}>Copy meals from</div>
            <div style={{fontSize:20,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif"}}>{sourceDay}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer"}}>✕</button>
        </div>

        {/* Source day summary */}
        <div style={{background:C.surf,borderRadius:12,padding:"12px 14px",marginBottom:18,border:"1px solid "+C.dim}}>
          <div style={{fontSize:11,color:C.accent,fontWeight:600,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>Copying these meals</div>
          {MEALS.map(m=>{
            const items=slotItems(plan[sourceDay]?.[m]);
            if(!items.length)return null;
            return(
              <div key={m} style={{display:"flex",gap:8,marginBottom:4,alignItems:"flex-start"}}>
                <span style={{fontSize:10,color:C.border,minWidth:68,paddingTop:1}}>{m}</span>
                <div style={{flex:1}}>
                  {items.map((item,i)=>(
                    <span key={i} style={{fontSize:11,color:C.text}}>{item.name}{i<items.length-1?", ":""}</span>
                  ))}
                </div>
              </div>
            );
          })}
          {!MEALS.some(m=>slotItems(plan[sourceDay]?.[m]).length>0)&&(
            <div style={{fontSize:12,color:C.muted}}>No meals planned on {sourceDay} yet.</div>
          )}
        </div>

        {/* Day picker */}
        <div style={{fontSize:12,color:C.text,fontWeight:600,marginBottom:12}}>Copy to which days?</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
          {others.map(d=>{
            const sel=selected.includes(d);
            const hasMeals=allFilled(d);
            return(
              <button key={d} onClick={()=>toggle(d)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,border:"2px solid "+(sel?C.accent:C.border),background:sel?"#1e2e1e":C.surf,cursor:"pointer",textAlign:"left",width:"100%"}}>
                <div style={{width:22,height:22,borderRadius:6,border:"2px solid "+(sel?C.accent:C.border),background:sel?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {sel&&<span style={{fontSize:13,color:"#0f1a0f",fontWeight:700}}>✓</span>}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:sel?C.accent:C.text}}>{d}</div>
                  {hasMeals&&<div style={{fontSize:10,color:C.warn,marginTop:1}}>Has existing meals</div>}
                </div>
              </button>
            );
          })}
        </div>

        {/* Quick-select buttons */}
        <div style={{display:"flex",gap:8,marginBottom:18}}>
          <button onClick={()=>setSelected(others)} style={{flex:1,padding:"8px 0",borderRadius:8,border:"1px solid "+C.border,background:C.surf,color:C.muted,fontSize:11,cursor:"pointer"}}>Select All</button>
          <button onClick={()=>setSelected(DAYS.filter(d=>d!==sourceDay&&!allFilled(d)))} style={{flex:1,padding:"8px 0",borderRadius:8,border:"1px solid "+C.border,background:C.surf,color:C.muted,fontSize:11,cursor:"pointer"}}>Empty Days Only</button>
          <button onClick={()=>setSelected([])} style={{flex:1,padding:"8px 0",borderRadius:8,border:"1px solid "+C.border,background:C.surf,color:C.muted,fontSize:11,cursor:"pointer"}}>Clear</button>
        </div>

        {/* Overwrite mode — only show if conflicts exist */}
        {hasConflict&&(
          <div style={{marginBottom:18}}>
            <div style={{fontSize:12,color:C.warn,fontWeight:600,marginBottom:10}}>⚠️ Some selected days have existing meals</div>
            <div style={{display:"flex",gap:8}}>
              {[{id:"merge",l:"Merge",desc:"Keep existing, add copied"},{id:"replace",l:"Replace",desc:"Clear day then copy"}].map(opt=>(
                <button key={opt.id} onClick={()=>setOverwrite(opt.id)} style={{flex:1,padding:"10px 8px",borderRadius:10,border:"2px solid "+(overwrite===opt.id?C.accent:C.border),background:overwrite===opt.id?"#1e2e1e":C.surf,cursor:"pointer",textAlign:"center"}}>
                  <div style={{fontSize:12,fontWeight:700,color:overwrite===opt.id?C.accent:C.text}}>{opt.l}</div>
                  <div style={{fontSize:10,color:C.muted,marginTop:2}}>{opt.desc}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        <button
          disabled={!selected.length||!MEALS.some(m=>slotItems(plan[sourceDay]?.[m]).length>0)}
          onClick={()=>{onCopy(selected,overwrite);onClose();}}
          style={{width:"100%",padding:"14px 0",borderRadius:12,border:"none",background:selected.length&&MEALS.some(m=>slotItems(plan[sourceDay]?.[m]).length>0)?C.accent:C.border,color:"#0f1a0f",fontWeight:700,fontSize:14,cursor:selected.length?"pointer":"not-allowed",opacity:selected.length?1:0.5}}>
          Copy to {selected.length} day{selected.length!==1?"s":""}
        </button>
      </div>
    </div>
  );
}

/* ─── Dashboard ──────────────────────────────────────────────────────────────── */
function Dashboard({profile,onBack,onEditProfile}){
  // Load saved data for this profile
  const saved=loadProfileData(profile.id)||{};
  const[plan,setPlan]=useState(saved.plan||{});
  const[targets,setTargets]=useState(saved.targets||profile.targets);
  const[activities,setActivities]=useState(saved.activities||[]);
  const[shopList,setShopList]=useState(saved.shopList||null);
  const[checked,setChecked]=useState(saved.checked||{});
  const[editing,setEditing]=useState(null);
  const[activeDay,setActiveDay]=useState("Monday");
  const[tab,setTab]=useState("plan");
  const[aiTip,setAiTip]=useState("");
  const[loadingTip,setLoadingTip]=useState(false);
  const[showAllowances,setShowAllowances]=useState(false);
  const[showActivity,setShowActivity]=useState(false);
  const[viewRecipe,setViewRecipe]=useState(null);
  const[loadingShop,setLoadingShop]=useState(false);
  const[shopError,setShopError]=useState("");
  const[showCopy,setShowCopy]=useState(false);

  // Auto-save whenever key state changes
  useEffect(()=>{
    saveProfileData(profile.id,{plan,targets,activities,shopList,checked});
    // Update lastActive
    const profiles=loadProfiles();
    const updated=profiles.map(p=>p.id===profile.id?{...p,lastActive:Date.now()}:p);
    saveProfiles(updated);
  },[plan,targets,activities,shopList,checked]);

  const dayPlan=plan[activeDay]||{};
  const dayKcal=Object.values(dayPlan).reduce((s,v)=>s+slotKcal(v),0);
  const weekKcal=DAYS.reduce((s,d)=>s+Object.values(plan[d]||{}).reduce((ms,v)=>ms+slotKcal(v),0),0);
  const burned=activities.reduce((s,a)=>s+a.burned,0);
  const netKcal=dayKcal-burned;
  const macros={protein:0,carbs:0,fat:0};
  Object.values(dayPlan).forEach(v=>{slotItems(v).forEach(m=>{if(m){macros.protein+=m.protein||0;macros.carbs+=m.carbs||0;macros.fat+=m.fat||0;}});});
  const goalInfo=GOALS.find(g=>g.id===profile.goal);
  const calPct=Math.min(100,Math.round((netKcal/targets.calories)*100));
  const calColor=netKcal>targets.calories?C.danger:calPct>85?C.accent:C.gold;

  const getTip=async()=>{
    setLoadingTip(true);
    try{const t=await claude(`One practical nutrition tip for ${goalInfo?.label} goal, targets: ${targets.calories}kcal ${targets.protein}g P ${targets.carbs}g C ${targets.fat}g F. 2-3 sentences, no bullets.`);setAiTip(t);}
    catch{setAiTip("Stay consistent and track your meals weekly!");}
    setLoadingTip(false);
  };
  useEffect(()=>{getTip();},[]);

  const allMeals=[];
  DAYS.forEach(d=>MEALS.forEach(m=>{slotItems(plan[d]?.[m]).forEach(item=>allMeals.push({day:d,slot:m,...item}));}));
  const generateShopList=async()=>{
    if(!allMeals.length)return;
    setLoadingShop(true);
    setShopError("");
    try{
      // Deduplicate: count how many times each unique meal appears
      const mealCounts={};
      allMeals.forEach(m=>{mealCounts[m.name]=(mealCounts[m.name]||0)+1;});
      const uniqueMeals=Object.entries(mealCounts).map(([name,count])=>count>1?name+" x"+count:name);
      const names=uniqueMeals.join(", ");
      const prompt='You are a shopping assistant. Create a grouped grocery list for someone cooking these meals this week: '+names+'. Return ONLY a valid JSON object, nothing else, no explanation, no markdown. Use exactly these category keys: {"Produce":[],"Meat & Fish":[],"Dairy":[],"Pantry":[],"Frozen":[],"Bakery":[],"Other":[]}. Each value is an array of strings with specific quantities, e.g. "3 chicken breasts", "2 bananas". Consolidate ingredients used across multiple meals. Include only non-empty categories.';
      const txt=await claude(prompt,1500);
      // Strip markdown fences if present
      const clean=txt.replace(/```json|```/g,"").trim();
      // Extract JSON object
      const match=clean.match(/\{[\s\S]*\}/);
      if(!match)throw new Error("No JSON found in response");
      const parsed=JSON.parse(match[0]);
      // Validate it's an object with at least one array
      if(typeof parsed!=="object"||!Object.values(parsed).some(v=>Array.isArray(v)&&v.length>0))
        throw new Error("Empty or invalid shopping list returned");
      setShopList(parsed);setChecked({});
    }catch(e){
      setShopError("Could not generate list: "+(e.message||"Unknown error")+". Try again.");
    }
    setLoadingShop(false);
  };
  const CAT_ICONS={"Produce":"🥦","Meat & Fish":"🥩","Dairy":"🥛","Pantry":"🫙","Frozen":"🧊","Bakery":"🍞","Other":"🛍️"};
  const totalItems=shopList?Object.values(shopList).flat().length:0;
  const checkedCount=Object.values(checked).filter(Boolean).length;

  return(
    <div style={{maxWidth:880,margin:"0 auto",padding:"0 16px 40px"}}>
      {viewRecipe&&<RecipeModal meal={viewRecipe} onClose={()=>setViewRecipe(null)}/>}
      {showAllowances&&<AllowancesEditor targets={targets} onSave={t=>setTargets(t)} onClose={()=>setShowAllowances(false)}/>}
      {showCopy&&<CopyDayModal sourceDay={activeDay} plan={plan} onClose={()=>setShowCopy(false)} onCopy={(days,mode)=>{setPlan(p=>{const src=p[activeDay]||{};const next={...p};days.forEach(d=>{if(mode==="replace"){next[d]={...src};}else{const existing=p[d]||{};const merged={};MEALS.forEach(m=>{const srcItems=slotItems(src[m]);const existItems=slotItems(existing[m]);merged[m]=[...existItems,...srcItems].filter(Boolean)||undefined;if(merged[m]&&!merged[m].length)delete merged[m];});next[d]=merged;}});return next;});}}/>}
      {showActivity&&<ActivityLogger weightKg={profile.weightKg} activities={activities} onAdd={a=>setActivities(p=>[...p,a])} onRemove={i=>setActivities(p=>p.filter((_,idx)=>idx!==i))} onClose={()=>setShowActivity(false)}/>}
      {editing&&<MealEditor day={editing.day} meal={editing.meal} profile={profile} targets={targets} onClose={()=>setEditing(null)} onSave={m=>setPlan(p=>{const slot=slotItems(p[editing.day]?.[editing.meal]);return{...p,[editing.day]:{...(p[editing.day]||{}),[editing.meal]:[...slot,m]}};})}/>}

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"20px 0 16px",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={onBack} style={{width:40,height:40,borderRadius:"50%",background:C.surf,border:"1px solid "+C.border,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{width:40,height:40,borderRadius:"50%",background:C.surf,border:"2px solid "+C.dim,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{profile.avatar||"🧑"}</div>
          <div>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1}}>🌿 Nourish</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:C.text,fontWeight:700,lineHeight:1.1}}>{profile.name}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={()=>setShowActivity(true)} style={{background:burned>0?"#1a2a1a":C.surf,border:"1px solid "+(burned>0?C.dim:C.border),borderRadius:8,padding:"8px 12px",color:burned>0?C.accent:C.muted,cursor:"pointer",fontSize:12,fontWeight:600}}>🏃{burned>0?" −"+burned:""}</button>
          <button onClick={()=>setShowAllowances(true)} style={{background:C.surf,border:"1px solid "+C.dim,borderRadius:8,padding:"8px 12px",color:C.accent,cursor:"pointer",fontSize:12,fontWeight:600}}>⚙</button>
          <button onClick={onEditProfile} style={{background:C.surf,border:"1px solid "+C.border,borderRadius:8,padding:"8px 12px",color:C.muted,cursor:"pointer",fontSize:12}}>✏️</button>
        </div>
      </div>

      {/* Goal + Calorie strip */}
      <div style={{background:C.card,borderRadius:14,padding:"16px 20px",marginBottom:12,border:"1px solid "+C.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div>
            <div style={{fontSize:12,color:C.muted}}>{goalInfo?.icon} {goalInfo?.label} · {profile.age}y {Math.round(profile.weightKg)}kg</div>
            <div style={{fontSize:13,fontWeight:600,color:C.text,marginTop:2}}>Net Calories Today</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:20,fontWeight:700,color:calColor,fontFamily:"'DM Mono',monospace"}}>{netKcal}</div>
            <div style={{fontSize:10,color:C.muted}}>/ {targets.calories} kcal</div>
          </div>
        </div>
        {burned>0&&<div style={{fontSize:11,color:C.muted,marginBottom:8}}>{dayKcal} eaten − {burned} burned = <strong style={{color:C.accent}}>{netKcal} net</strong></div>}
        <div style={{height:8,borderRadius:4,background:C.surf,overflow:"hidden"}}><div style={{height:"100%",width:calPct+"%",background:calColor,borderRadius:4,transition:"width 0.4s"}}/></div>
      </div>

      {/* Macro rings */}
      <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <Ring label="Protein" current={macros.protein} target={targets.protein} unit="g" color={C.accent}/>
        <Ring label="Carbs" current={macros.carbs} target={targets.carbs} unit="g" color={C.blue}/>
        <Ring label="Fat" current={macros.fat} target={targets.fat} unit="g" color={C.warn}/>
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:"12px 10px",textAlign:"center",flex:1,minWidth:90}}>
          <div style={{fontSize:22,marginBottom:4}}>📅</div>
          <div style={{fontSize:13,fontWeight:700,color:C.text,fontFamily:"'DM Mono',monospace"}}>{weekKcal}</div>
          <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:0.8}}>Week kcal</div>
        </div>
      </div>

      {/* AI Tip */}
      {(aiTip||loadingTip)&&<div style={{background:"#1a2a1a",borderRadius:14,padding:"14px 18px",marginBottom:16,border:"1px solid "+C.dim}}>
        <div style={{fontSize:11,color:C.accent,fontWeight:600,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>✨ Daily Tip</div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.6}}>{loadingTip?"Generating tip…":aiTip}</div>
        <button onClick={getTip} style={{marginTop:8,background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:11}}>↻ New tip</button>
      </div>}

      {/* Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
        {[["plan","📅 Plan"],["activity","🏃 Activity"],["shop","🛒 Shopping"],["overview","📊 Overview"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{padding:"10px 14px",borderRadius:10,border:"none",cursor:"pointer",background:tab===id?C.accent:C.surf,color:tab===id?"#0f1a0f":C.muted,fontWeight:600,fontSize:12}}>{label}</button>
        ))}
      </div>

      {/* Plan tab */}
      {tab==="plan"&&<>
        <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
          {DAYS.map(d=>{const dCal=Object.values(plan[d]||{}).reduce((s,m)=>s+(m?.calories||0),0);const filled=Object.values(plan[d]||{}).filter(Boolean).length;return(
            <button key={d} onClick={()=>setActiveDay(d)} style={{padding:"8px 14px",borderRadius:10,border:"2px solid "+(activeDay===d?C.accent:C.border),background:activeDay===d?"#1e2e1e":C.surf,cursor:"pointer"}}>
              <div style={{fontSize:12,fontWeight:600,color:activeDay===d?C.accent:C.text}}>{d.slice(0,3)}</div>
              {filled>0&&<div style={{fontSize:9,color:C.muted,marginTop:2}}>{dCal} kcal</div>}
            </button>
          );})}
        </div>
        {/* Copy day bar */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,background:C.surf,borderRadius:10,padding:'8px 14px',border:'1px solid '+C.border,marginTop:8}}>
          <div style={{fontSize:12,color:C.muted}}>{activeDay}'s meals</div>
          <button onClick={()=>setShowCopy(true)} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:8,border:'1px solid '+C.dim,background:'none',color:C.accent,fontSize:12,fontWeight:600,cursor:'pointer'}}><span style={{fontSize:14}}>📋</span> Copy to other days</button>
        </div>
        <div style={{background:C.card,borderRadius:16,padding:20,border:"1px solid "+C.border}}>
          <div style={{fontSize:16,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif",marginBottom:16}}>{activeDay}'s Meals</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
            {MEALS.map(m=><div key={m}><div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{m}</div><MealCell day={activeDay} meal={m} value={dayPlan[m]} onEdit={(d,ml)=>setEditing({day:d,meal:ml})} onRecipe={setViewRecipe} onRemoveItem={(d,ml,i)=>setPlan(p=>{const slot=slotItems(p[d]?.[ml]).filter((_,idx)=>idx!==i);const updated={...p,[d]:{...(p[d]||{}),[ml]:slot.length?slot:undefined}};return updated;})} onClearSlot={(d,ml)=>setPlan(p=>({...p,[d]:{...(p[d]||{}),[ml]:undefined}}))}/></div>)}
          </div>
        </div>
      </>}

      {/* Activity tab */}
      {tab==="activity"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:C.card,borderRadius:16,padding:20,border:"1px solid "+C.border}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontSize:16,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif"}}>Today's Activity</div>
            <button onClick={()=>setShowActivity(true)} style={{background:C.accent,border:"none",borderRadius:8,padding:"8px 14px",color:"#0f1a0f",cursor:"pointer",fontSize:12,fontWeight:700}}>+ Log</button>
          </div>
          {activities.length===0?<div style={{textAlign:"center",padding:"30px 0"}}><div style={{fontSize:40,marginBottom:10}}>🏅</div><div style={{color:C.muted,fontSize:13}}>No activities logged yet</div></div>:(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {activities.map((a,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:C.surf,borderRadius:12,padding:"12px 14px",border:"1px solid "+C.border}}>
                  <span style={{fontSize:24}}>{a.icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:C.text}}>{a.label}</div><div style={{fontSize:11,color:C.muted}}>{a.duration} min · {a.intensity}</div></div>
                  <div style={{fontSize:14,fontWeight:700,color:C.accent,fontFamily:"'DM Mono',monospace"}}>−{a.burned} kcal</div>
                  <button onClick={()=>setActivities(p=>p.filter((_,idx)=>idx!==i))} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>✕</button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>}

      {/* Shopping tab */}
      {tab==="shop"&&<div>
        {allMeals.length===0?<div style={{background:C.card,borderRadius:16,padding:28,border:"1px solid "+C.border,textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🛒</div><div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:8}}>No meals planned yet</div><div style={{fontSize:13,color:C.muted}}>Add meals to your weekly plan first.</div></div>:(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{background:C.card,borderRadius:16,padding:20,border:"1px solid "+C.border}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div><div style={{fontSize:16,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif"}}>🛒 Shopping List</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{allMeals.length} meals · {shopList?checkedCount+"/"+totalItems+" ticked":"tap Generate"}</div></div>
                <button onClick={()=>{setShopError("");generateShopList();}} disabled={loadingShop} style={{background:C.accent,border:"none",borderRadius:10,padding:"10px 16px",color:"#0f1a0f",fontWeight:700,fontSize:13,cursor:loadingShop?"wait":"pointer"}}>{loadingShop?"⏳…":shopList?"↻ Refresh":"✨ Generate"}</button>
              </div>
              {(()=>{
                // Group by day for tidy summary
                const byDay={};
                allMeals.forEach(m=>{if(!byDay[m.day])byDay[m.day]=[];byDay[m.day].push(m.name);});
                return Object.entries(byDay).map(([day,names])=>(
                  <div key={day} style={{display:"flex",gap:8,fontSize:11,marginBottom:5,alignItems:"flex-start"}}>
                    <span style={{color:C.border,minWidth:72,flexShrink:0,paddingTop:1}}>{day.slice(0,3)}</span>
                    <span style={{color:C.text,lineHeight:1.5}}>{names.join(", ")}</span>
                  </div>
                ));
              })()}
            </div>
            {shopError&&!loadingShop&&<div style={{background:"#2a1515",border:"1px solid "+C.danger,borderRadius:12,padding:"14px 16px",display:"flex",alignItems:"flex-start",gap:12}}><span style={{fontSize:22,flexShrink:0}}>⚠️</span><div><div style={{fontSize:13,color:C.danger,fontWeight:600,marginBottom:4}}>Could not generate shopping list</div><div style={{fontSize:12,color:C.muted,lineHeight:1.5,marginBottom:8}}>{shopError}</div><button onClick={()=>{setShopError("");generateShopList();}} style={{background:C.accent,border:"none",borderRadius:8,padding:"8px 16px",color:"#0f1a0f",fontWeight:700,fontSize:12,cursor:"pointer"}}>↻ Try Again</button></div></div>}
            {shopList&&Object.entries(shopList).filter(([,items])=>items.length>0).map(([cat,items])=>(
              <div key={cat} style={{background:C.card,borderRadius:14,padding:18,border:"1px solid "+C.border}}>
                <div style={{fontSize:13,fontWeight:700,color:C.accent,marginBottom:12}}>{CAT_ICONS[cat]||"🛍️"} {cat} <span style={{fontSize:10,color:C.muted,fontWeight:400}}>{items.filter((_,i)=>checked[cat+i]).length}/{items.length}</span></div>
                {items.map((item,i)=>{const key=cat+i,done=checked[key];return(
                  <div key={i} onClick={()=>setChecked(c=>({...c,[key]:!c[key]}))} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:8,cursor:"pointer",marginBottom:4,background:done?C.surf:"transparent"}}>
                    <div style={{width:22,height:22,borderRadius:6,border:"2px solid "+(done?C.accent:C.border),background:done?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{done&&<span style={{fontSize:12,color:"#0f1a0f",fontWeight:700}}>✓</span>}</div>
                    <span style={{fontSize:13,color:done?C.muted:C.text,textDecoration:done?"line-through":"none"}}>{item}</span>
                  </div>
                );})}
              </div>
            ))}
            {shopList&&checkedCount===totalItems&&totalItems>0&&<div style={{background:"#1a2e1a",borderRadius:14,padding:20,border:"1px solid "+C.dim,textAlign:"center"}}><div style={{fontSize:28,marginBottom:8}}>🎉</div><div style={{fontSize:14,fontWeight:700,color:C.accent}}>All done! Happy cooking.</div></div>}
          </div>
        )}
      </div>}

      {/* Overview tab */}
      {tab==="overview"&&<div style={{background:C.card,borderRadius:16,padding:20,border:"1px solid "+C.border}}>
        <div style={{fontSize:16,fontWeight:700,color:C.text,fontFamily:"'Playfair Display',serif",marginBottom:16}}>Weekly Overview</div>
        {DAYS.map(d=>{const dCal=Object.values(plan[d]||{}).reduce((s,v)=>s+slotKcal(v),0);const meals=Object.entries(plan[d]||{}).filter(([,v])=>slotItems(v).length>0);const p=Math.min(100,Math.round((dCal/targets.calories)*100));const col=dCal>targets.calories?C.danger:p>85?C.accent:C.gold;return(
          <div key={d} style={{background:C.surf,borderRadius:12,padding:"14px 16px",border:"1px solid "+C.border,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:600,color:C.text,fontSize:14}}>{d}</span><span style={{fontSize:12,color:col,fontFamily:"'DM Mono',monospace"}}>{dCal} / {targets.calories} kcal</span></div>
            <div style={{height:4,borderRadius:2,background:C.card,overflow:"hidden",marginBottom:8}}><div style={{height:"100%",width:p+"%",background:col,borderRadius:2}}/></div>
            {meals.length>0?<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{meals.map(([mt,v])=>slotItems(v).map((m,i)=><span key={mt+i} style={{fontSize:10,background:C.card,borderRadius:6,padding:"3px 8px",color:C.muted}}>{i===0?mt+": ":""}{m.name}</span>))}</div>:<span style={{fontSize:11,color:C.border}}>No meals planned</span>}
          </div>
        );})}
      </div>}
    </div>
  );
}

/* ─── App Root ───────────────────────────────────────────────────────────────── */
function App(){
  const[screen,setScreen]=useState("switcher"); // switcher | create | edit | dashboard
  const[activeProfile,setActiveProfile]=useState(null);

  const handleSelectProfile=(p)=>{setActiveProfile(p);setScreen("dashboard");};
  const handleCreateProfile=()=>setScreen("create");
  const handleSaveNewProfile=(profile)=>{
    const profiles=loadProfiles();
    profiles.push(profile);
    saveProfiles(profiles);
    // initialise empty data store
    saveProfileData(profile.id,{plan:{},targets:profile.targets,activities:[],shopList:null,checked:{}});
    setActiveProfile(profile);
    setScreen("dashboard");
  };
  const handleSaveEditProfile=(profile)=>{
    const profiles=loadProfiles();
    const updated=profiles.map(p=>p.id===profile.id?profile:p);
    saveProfiles(updated);
    // update targets in saved data
    const data=loadProfileData(profile.id)||{};
    saveProfileData(profile.id,{...data,targets:profile.targets});
    setActiveProfile(profile);
    setScreen("dashboard");
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'DM Sans',sans-serif"}}>
      {screen==="switcher"&&<ProfileSwitcher onSelect={handleSelectProfile} onCreate={handleCreateProfile}/>}
      {screen==="create"&&<ProfileForm onSave={handleSaveNewProfile} onCancel={()=>setScreen("switcher")}/>}
      {screen==="edit"&&activeProfile&&<ProfileForm existing={activeProfile} onSave={handleSaveEditProfile} onCancel={()=>setScreen("dashboard")}/>}
      {screen==="dashboard"&&activeProfile&&<Dashboard profile={activeProfile} onBack={()=>setScreen("switcher")} onEditProfile={()=>setScreen("edit")}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  const sw=`const CACHE='nourish-v7';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{const u=e.request.url;if(u.includes('anthropic')||u.includes('fonts.g')||u.includes('allorigins')||u.includes('corsproxy')||u.includes('openfoodfacts'))return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const c=res.clone();caches.open(CACHE).then(ca=>ca.put(e.request,c));}return res;}).catch(()=>caches.match(e.request))));});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
